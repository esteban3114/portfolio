<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Found this bag? · este-dls.com</title>

<!-- Kept out of search results: this is meant to be reached by
     scanning the tag on the bag, not found by accident. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<!-- The field surrounds everything, so the browser chrome matches it. -->
<meta name="theme-color" content="#D25A22">
<meta name="color-scheme" content="only light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23D25A22'/><rect x='9' y='11' width='14' height='12' rx='2' fill='none' stroke='%231B1310' stroke-width='2.4'/><path d='M13 11V8h6v3' fill='none' stroke='%231B1310' stroke-width='2.4'/></svg>">

<style>
/* ─────────────────────────────────────────────────────────────
   Tokens. One fixed palette, deliberately: this is a signal
   object. It looks the same in daylight, at night, in any OS
   theme — like the hi-vis label it is descended from.
   ───────────────────────────────────────────────────────────── */
:root{
  --signal:#D25A22;
  --ink:#1B1310;
  --stock:#EAE6DC;
  --rule:rgba(27,19,16,.24);
  --ghost:rgba(27,19,16,.62);

  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono","DejaVu Sans Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  --pad:clamp(1.25rem,6vw,2.5rem);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}

html{-webkit-text-size-adjust:100%;}

/* .act sets display:flex, which would beat the UA stylesheet's
   [hidden]{display:none}. Needed for the contact-mode switch. */
[hidden]{display:none !important;}

/* The page background is what paints the strips behind the iOS status bar
   and toolbar, so it has to be the colour that surrounds everything: the
   orange field. The panel floats on it rather than touching either edge —
   see .panel. */
html,body{background:var(--signal);}

body{
  min-height:100dvh;
  color:var(--ink);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
}

/* Upper field: owns the orange, so it cannot leak past the panel. */
.field{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  background:var(--signal);
}

/* One shared focus treatment. Legible on both grounds. */
a:focus-visible,select:focus-visible{
  outline:3px solid var(--ink);
  outline-offset:3px;
  border-radius:2px;
}
.panel a:focus-visible{outline-color:var(--ink);}

/* ── Utility bar ─────────────────────────────────────────── */
.bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  padding:calc(var(--safe-t) + .75rem) var(--pad) 0;
}
.bar__mark{
  font-family:var(--mono);
  font-size:.7rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ghost);
}

.lang{position:relative;display:flex;align-items:center;}
.lang__select{
  appearance:none;-webkit-appearance:none;
  font-family:var(--mono);
  font-size:.7rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink);
  background:transparent;
  border:1.5px solid var(--rule);
  border-radius:2px;
  padding:.7rem 2rem .7rem .7rem;
  min-height:44px;
  cursor:pointer;
}
.lang__caret{
  position:absolute;
  inset-inline-end:.7rem;
  width:0;height:0;
  border-inline:4px solid transparent;
  border-top:5px solid var(--ink);
  pointer-events:none;
}

/* ── Upper field: the signature ──────────────────────────── */
.head{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:1.5rem;
  padding:2rem var(--pad);
}

/* The routing strip, lifted off a real bag tag. Origin node is
   the situation; destination node is the person. The elbow is
   the journey the bag still has to make. */
.route{
  position:relative;
  display:flex;
  align-items:center;
  gap:.9rem;
  padding-bottom:2.4rem;
}
.route__node{
  font-family:var(--mono);
  font-size:.78rem;
  font-weight:600;
  letter-spacing:.2em;
  text-transform:uppercase;
  white-space:nowrap;
}
.route__h{
  flex:1 1 auto;
  height:2px;
  background:var(--ink);
  transform:scaleX(0);
  transform-origin:left center;
  animation:draw-h .5s cubic-bezier(.65,0,.35,1) .15s forwards;
}
[dir="rtl"] .route__h{transform-origin:right center;}
.route__v{
  position:absolute;
  inset-inline-end:0;
  top:calc(50% - 1.2rem);
  width:2px;
  height:2.4rem;
  background:var(--ink);
  transform:scaleY(0);
  transform-origin:top center;
  animation:draw-v .28s cubic-bezier(.65,0,.35,1) .62s forwards;
}
.route__v::after{
  content:"";
  position:absolute;
  bottom:-1px;
  inset-inline-start:-4px;
  width:0;height:0;
  border-inline:5px solid transparent;
  border-top:7px solid var(--ink);
}

.name{
  margin:0;
  font-size:clamp(3.25rem,17vw,6.5rem);
  font-weight:800;
  line-height:.88;
  letter-spacing:-.04em;
  text-wrap:balance;
  opacity:0;
  animation:rise .5s cubic-bezier(.2,.8,.3,1) .8s forwards;
}
.pitch{
  margin:0;
  max-width:34ch;
  color:var(--ink);
  opacity:0;
  animation:rise .5s cubic-bezier(.2,.8,.3,1) .96s forwards;
}

@keyframes draw-h{to{transform:scaleX(1);}}
@keyframes draw-v{to{transform:scaleY(1);}}
@keyframes rise{
  from{opacity:0;transform:translateY(.6rem);}
  to{opacity:1;transform:none;}
}

/* ── Lower field: the tag stock, in the thumb zone ───────── */
/* A card lifted off the bottom edge, not a slab flush to it.
   iOS Safari paints the strips behind its chrome from the page background
   and nothing in the document can reach them — not a shadow, not a fixed
   element. So a panel touching the bottom would require the page
   background to be orange at the top and pale at the bottom at once,
   which is impossible. Floating the panel makes the orange around it the
   composition rather than a defect, matches the wide layout, and keeps
   the actions clear of the home indicator. */
.panel{
  flex:0 0 auto;
  background:var(--stock);
  border-radius:14px;
  padding:var(--pad);
  margin:0 var(--pad) calc(var(--safe-b) + var(--pad));
  display:flex;
  flex-direction:column;
  gap:.6rem;
}

.act{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  min-height:60px;
  padding:.9rem 1.1rem;
  border:2px solid transparent;
  border-radius:8px;
  text-decoration:none;
  color:var(--ink);
  font-weight:600;
  transition:transform .12s ease;
}
.act:active{transform:scale(.985);}

.act--wa{background:var(--ink);color:var(--stock);}
.act--call{background:transparent;border-color:var(--ink);}
.act--mail{
  background:transparent;
  min-height:52px;
  font-weight:500;
  color:var(--ghost);
  border-top:1.5px solid var(--rule);
  border-radius:0;
  margin-top:.4rem;
  padding-inline:.2rem;
}

.act__meta{
  font-family:var(--mono);
  font-size:.72rem;
  font-weight:500;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-variant-numeric:tabular-nums;
  opacity:.72;
  white-space:nowrap;
}
.act--call .act__meta{
  font-size:.82rem;
  letter-spacing:.06em;
  text-transform:none;
  opacity:1;
}

/* In username mode the meta slot carries the handle rather than a
   ranking label, so the finder can see who they are about to
   message. Same mono treatment the phone number used to get. */
.act--wa .act__meta--handle{
  font-size:.82rem;
  letter-spacing:.04em;
  text-transform:none;
  opacity:.8;
  overflow-wrap:anywhere;
  white-space:normal;
}

.foot{
  font-family:var(--mono);
  font-size:.66rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ghost);
  padding-top:.5rem;
}

/* Wider screens: hold the composition instead of stretching it. The panel
   becomes a floating card, so the orange goes back to being the ground. */
@media (min-width:620px){
  body{align-items:center;}
  .field{width:100%;max-width:34rem;background:none;}
  .panel{width:100%;max-width:34rem;margin-inline:0;}
  .head{padding-block:3rem;}
}

@media (prefers-reduced-motion:reduce){
  .route__h,.route__v,.name,.pitch{animation:none;opacity:1;transform:none;}
}
</style>
</head>
<body>

<div class="field">
<header class="bar">
  <span class="bar__mark">este-dls.com</span>
  <span class="lang">
    <select class="lang__select" id="lang" aria-label="Language"></select>
    <span class="lang__caret" aria-hidden="true"></span>
  </span>
</header>

<main class="head">
  <div class="route" aria-hidden="true">
    <span class="route__node" id="routeNode">Found</span>
    <span class="route__h"></span>
    <span class="route__v"></span>
  </div>
  <h1 class="name" id="name">Esteban</h1>
  <p class="pitch" id="pitch"></p>
</main>
</div>

<div class="panel">
  <!-- One tap in both modes. Only the target and the meta differ. -->
  <a class="act act--wa" id="waLink" rel="noreferrer">
    <span id="waLabel"></span>
    <span class="act__meta" id="waMeta"></span>
  </a>
  <!-- MODE "phone" only: a number to ring. -->
  <a class="act act--call" id="callLink" rel="noreferrer" hidden>
    <span id="callLabel"></span>
    <span class="act__meta" id="callMeta"></span>
  </a>

  <a class="act act--mail" id="mailLink" rel="noreferrer">
    <span id="mailLabel"></span>
    <span class="act__meta" aria-hidden="true">&#8599;</span>
  </a>
  <p class="foot" id="foot"></p>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   EDIT ONLY THIS BLOCK.

   MODE picks how the finder reaches me on WhatsApp:

   "username" — one tap, and nothing personal on the page. wa.me
                accepts a username directly (verified: it routes
                to type=username and keeps the prefilled ?text=).
                No call button, because there is no number to
                publish — that is the point.
                ⚠ Leave the WhatsApp "username key" (PIN) OFF.
                With it on, a stranger who has the username
                still cannot message me, which defeats the page.
   "phone"    — one tap via wa.me plus a number to ring, for a
                finder with no WhatsApp. Cost: the number is
                published and will eventually be scraped.

   phone / whatsapp must be E.164 (leading +, no spaces).
   Links are assembled at runtime, so no tel:/mailto: string
   sits in the served HTML for naive address harvesters to
   regex out. That is a speed bump, not real protection —
   see the note in the README.
   ═══════════════════════════════════════════════════════════ */
var MODE = "username";   /* "phone" | "username" */

/* ⚠ This whole block ships to the browser whatever MODE says.
   The phone fields below are unused in "username" mode — leave
   them as placeholders. Putting the real number here would
   publish it in the page source even though nothing renders it. */
var CONTACT = {

  phoneDisplay: "+33 6 00 00 00 00",
  whatsapp:     "+33600000000",
  username:     "este.dls",

/* ── Copy. English is the fallback for any unlisted language. ── */
var STRINGS = {

      wa:"Message on WhatsApp",fastest:"Fastest",call:"Call",mail:"Email",

  es:{label:"Español",found:"Encontrada",

      mailBody:"Hola Esteban — he encontrado tu maleta. Está aquí:\n\n",
      tag:"Etiqueta de equipaje"},
  de:{label:"Deutsch",found:"Gefunden",
      pitch:"Danke, dass Sie ihn aufgehoben haben. Schreiben Sie mir kurz, dann hole ich ihn ab, wo auch immer Sie sind.",
      wa:"Auf WhatsApp schreiben",fastest:"Am schnellsten",call:"Anrufen",mail:"E-Mail",
      waText:"Hallo Esteban — ich habe Ihren Koffer gefunden.",
      mailSubject:"Ich habe Ihren Koffer gefunden",
      mailBody:"Hallo Esteban — ich habe Ihren Koffer gefunden. Er ist hier:\n\n",
      tag:"Gepäckanhänger"},
  it:{label:"Italiano",found:"Trovata",
      pitch:"Grazie per averla raccolta. Mandami un messaggio e vengo a prenderla, dovunque tu sia.",
      wa:"Scrivi su WhatsApp",fastest:"Il più rapido",call:"Chiama",mail:"Email",

  pt:{label:"Português",found:"Encontrada",

      wa:"Escrever no WhatsApp",fastest:"Mais rápido",call:"Ligar",mail:"E-mail",

      pitch:"Bedankt dat je hem hebt opgepakt. Stuur me een bericht en ik kom hem halen, waar je ook bent.",

  pl:{label:"Polski",found:"Znaleziona",
      pitch:"Dziękuję za podniesienie jej. Napisz do mnie, a przyjadę po nią, gdziekolwiek jesteś.",
      wa:"Napisz na WhatsAppie",fastest:"Najszybciej",call:"Zadzwoń",mail:"E-mail",

  ar:{label:"العربية",found:"وُجدت",rtl:true,

  zh:{label:"中文",found:"已找到",

  ko:{label:"한국어",found:"발견됨",
      pitch:"주워 주셔서 감사합니다. 메시지 한 통 보내 주시면 어디든 찾아가겠습니다.",
      wa:"WhatsApp으로 연락",fastest:"가장 빠름",call:"전화하기",mail:"이메일",
      waText:"Esteban님, 캐리어를 찾았습니다.",
      mailSubject:"캐리어를 찾았습니다",

      tag:"수하물 태그"}

var DEFAULT_LANG = "en";

/* Match the phone's language list against what we actually have.
   navigator.languages is ordered by the user's own preference, so
   the first hit wins; region subtags (pt-BR, zh-Hant) collapse to
   the base language rather than falling all the way back. */
function detect(){
  var wanted = navigator.languages && navigator.languages.length
    ? navigator.languages
    : [navigator.language || DEFAULT_LANG];
  for (var i = 0; i < wanted.length; i++){
    var base = String(wanted[i]).toLowerCase().split("-")[0];
    if (STRINGS[base]) return base;
  }
  return DEFAULT_LANG;
}

function buildPicker(){
  var sel = document.getElementById("lang");
  Object.keys(STRINGS).forEach(function(code){
    var opt = document.createElement("option");
    opt.value = code;
    opt.textContent = STRINGS[code].label;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", function(){ apply(sel.value); });
}

function apply(code){
  var t = STRINGS[code] || STRINGS[DEFAULT_LANG];
  var byUsername = MODE === "username";

  document.documentElement.lang = code;
  document.documentElement.dir = t.rtl ? "rtl" : "ltr";
  document.getElementById("lang").value = code;

  document.getElementById("name").textContent = CONTACT.name;
  document.getElementById("routeNode").textContent = t.found;
  document.getElementById("pitch").textContent = t.pitch;
  document.getElementById("foot").textContent = "este-dls.com · " + t.tag;

  /* wa.me routes a username and a number down separate branches
     (type=username vs type=phone_number) and keeps ?text= on both,
     so the finder gets one tap either way. */
  var target = byUsername
    ? CONTACT.username
    : CONTACT.whatsapp.replace(/[^\d]/g, "");
  document.getElementById("waLabel").textContent = t.wa;
  document.getElementById("waLink").href =
    "https://wa.me/" + target + "?text=" + encodeURIComponent(t.waText);

  /* Username mode shows who the tap reaches; phone mode ranks the
     button against the call below it. */
  var waMeta = document.getElementById("waMeta");
  waMeta.textContent = byUsername ? CONTACT.username : t.fastest;
  waMeta.classList.toggle("act__meta--handle", byUsername);

  document.getElementById("callLink").hidden = byUsername;
  if (!byUsername){
    document.getElementById("callLabel").textContent = t.call;
    document.getElementById("callMeta").textContent  = CONTACT.phoneDisplay;
    document.getElementById("callLink").href = "tel:" + CONTACT.phone;
  }

  document.getElementById("mailLabel").textContent = t.mail;
  document.getElementById("mailLink").href = "mailto:" + CONTACT.email +
    "?subject=" + encodeURIComponent(t.mailSubject) +
    "&body="    + encodeURIComponent(t.mailBody);
}

buildPicker();
apply(detect());
</script>
